<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aeroporto - Cadastro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Aeroporto</h1>
    <p>Cadastro de companhias, aviões e passageiros</p>
  </header>

  <section>
    <h2>Companhias</h2>
    <form id="form-companhias"></form>
    <p class="msg" id="companhias-msg"></p>
    <div id="companhias-lista"></div>
  </section>

  <section>
    <h2>Aviões</h2>
    <form id="form-avioes"></form>
    <p class="msg" id="avioes-msg"></p>
    <div id="avioes-lista"></div>
  </section>

  <section>
    <h2>Passageiros</h2>
    <form id="form-passageiros"></form>
    <p class="msg" id="passageiros-msg"></p>
    <div id="passageiros-lista"></div>
  </section>

  <script src="script.js"></script>
</body>
</html>
