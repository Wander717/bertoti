spring.application.name=airport

# Banco H2 em arquivo (os dados ficam salvos entre reinícios)
spring.datasource.url=jdbc:h2:file:./data/airportdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=root

# Cria/atualiza as tabelas automaticamente com base nas entidades
spring.jpa.hibernate.ddl-auto=update

# Console web do H2, útil pra inspecionar as tabelas no navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Porta do servidor (padrão já é 8080, deixo explícito)
server.port=8080
